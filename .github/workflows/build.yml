name: Build CYD Web Terminal (ESP-IDF, no PlatformIO)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C5 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32c5
          path: .
          command: idf.py build
      - name: Package firmware
        run: |
          mkdir -p output
          cp build/cyd_web_terminal.bin output/cyd-web-terminal.bin
          cp build/bootloader/bootloader.bin output/bootloader.bin
          cp build/partition_table/partition-table.bin output/partition-table.bin
          cp partitions.csv output/partitions.csv
          printf 'ESP-IDF v5.4.2; target ESP32-C5; 4MB flash; OTA partition layout\n' > output/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cyd-web-terminal-firmware
          path: output/*
          if-no-files-found: error
          retention-days: 30
